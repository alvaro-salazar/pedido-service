services:

  cliente-postgres:
    image: postgres:16-alpine
    container_name: cliente_db
    environment:
      POSTGRES_DB: curso_springboot
      POSTGRES_USER: devdb
      POSTGRES_PASSWORD: a1b2c3d4
    ports:
      - "5433:5432"
    volumes:
      - cliente_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdb -d curso_springboot"]
      interval: 5s
      timeout: 5s
      retries: 10

  cliente-service:
    build: ../cliente-service
    container_name: cliente_service
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://cliente-postgres:5432/curso_springboot
      DB_USERNAME: devdb
      DB_PASSWORD: a1b2c3d4
      JPA_DDL: create-drop
      # KEYCLOAK_ISSUER_URI usa el default del properties (localhost:8090) — valida el claim iss del token.
      # KEYCLOAK_JWK_SET_URI apunta al contenedor keycloak (red Docker interna) para descargar claves públicas.
      # Con ambos definidos Spring Boot crea UN solo JwtDecoder (jwk-set-uri tiene prioridad)
      # que verifica la firma vía Docker network y valida el issuer contra localhost:8090.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/curso-springboot/protocol/openid-connect/certs
    depends_on:
      cliente-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  producto-postgres:
    image: postgres:16-alpine
    container_name: producto_db
    environment:
      POSTGRES_DB: curso_springboot
      POSTGRES_USER: devdb
      POSTGRES_PASSWORD: a1b2c3d4
    ports:
      - "5435:5432"
    volumes:
      - producto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdb -d curso_springboot"]
      interval: 5s
      timeout: 5s
      retries: 10

  producto-service:
    build: ../spring-boot-11/producto-service
    container_name: producto_service
    ports:
      - "8082:8082"
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://producto-postgres:5432/curso_springboot
      DB_USERNAME: devdb
      DB_PASSWORD: a1b2c3d4
      JPA_DDL: create-drop
      # Sobreescribe issuer-uri para fetch de claves vía red Docker interna.
      # La validación del claim iss sigue usando el default localhost:8090.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8090/realms/curso-springboot/protocol/openid-connect/certs
    depends_on:
      producto-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  pedido-postgres:
    image: postgres:16-alpine
    container_name: pedido_db
    environment:
      POSTGRES_DB: pedidodb
      POSTGRES_USER: pedido
      POSTGRES_PASSWORD: pedido123
    ports:
      - "5434:5432"
    volumes:
      - pedido_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedido -d pedidodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: pedido_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedido_kafka_ui
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: pedido_keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8090
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8090
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8090:8090"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  cliente_pgdata:
  producto_pgdata:
  pedido_pgdata:
