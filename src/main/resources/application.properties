spring.application.name=pedido-service
server.port=${SERVER_PORT:8084}

management.server.port=${MANAGEMENT_PORT:8085}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/pedidodb}
spring.datasource.username=${DB_USER:pedido}
spring.datasource.password=${DB_PASS:pedido123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8090/realms/curso-springboot}

services.cliente.base-url=${CLIENTE_SERVICE_URL:http://localhost:8080}
services.producto.base-url=${PRODUCTO_SERVICE_URL:http://localhost:8082}

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Exactly-once: producer idempotente + transacciones
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.transaction-id-prefix=pedido-tx-

spring.kafka.consumer.group-id=pedido-pago-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest

# ── pago-service ──────────────────────────────────────────────────────────────
services.pago.base-url=${PAGO_SERVICE_URL:http://localhost:8088}
